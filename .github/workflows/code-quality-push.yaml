name: Code Quality

on:
  push:
    branches:
      - master

jobs:
  codeQuality:
    runs-on: ubuntu-22.04
    name: PHP
    steps:
      - name: Checkout changes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PHP and linter
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.4'
          # Only parallel-lint is used by these jobs (tests + style are gated by
          # tests.yaml / grumphp) — installing unused tools is the slow part.
          tools: parallel-lint
      - name: Run code quality checks
        run: ./.github/workflows/utilities/lint-push
