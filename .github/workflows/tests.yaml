name: Tests

on:
  push:
    branches:
      - master
  pull_request:

# Never cancel a run on master; supersede older runs of the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  phpUnitTests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { operatingSystem: ubuntu-22.04, phpVersion: '8.4', dependencies: highest }
          - { operatingSystem: windows-latest, phpVersion: '8.4', dependencies: highest }
          # The oldest versions composer.json allows: catches a dependency floor that is too low.
          - { operatingSystem: ubuntu-22.04, phpVersion: '8.4', dependencies: lowest }
          # Next PHP: reports new deprecations early, but does not fail the run yet.
          - { operatingSystem: ubuntu-22.04, phpVersion: '8.5', dependencies: highest, experimental: true }
    runs-on: ${{ matrix.operatingSystem }}
    continue-on-error: ${{ matrix.experimental == true }}
    timeout-minutes: 15
    name: ${{ matrix.operatingSystem }} / PHP ${{ matrix.phpVersion }} / ${{ matrix.dependencies }} deps
    steps:
      - name: Checkout changes
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.phpVersion }}
          tools: composer:v2
          # What the library, PHPUnit, Composer and the Symfony components actually use.
          extensions: ctype, curl, dom, iconv, json, libxml, mbstring, openssl, simplexml, tokenizer, xml, xmlwriter
          coverage: none

      - name: Setup dependency cache
        id: composercache
        shell: bash
        run: |
          dir=$(composer config cache-files-dir | sed 's|\\|/|g')
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.dependencies }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.dependencies }}-

      - name: Install Composer dependencies
        shell: bash
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress --no-scripts
          else
            composer install --no-interaction --no-progress --no-scripts
          fi

      - name: Fetch recorded fixtures from source
        # Tests are hermetic against recorded responses. link-fixtures clones the
        # jikan-me/jikan-fixtures repo and re-points the package at it, so CI never
        # depends on the packagist dev-master snapshot being fresh (a new fixtures PR
        # used to break CI until the lock pin was bumped).
        run: composer run-script link-fixtures

      - name: Run tests
        env:
          CI_ENV: true
        run: ./vendor/bin/paratest
