name: Tests

on:
  push:
    branches:
      - master
  pull_request:

# Never cancel a run on master; supersede older runs of the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  phpUnitTests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { operatingSystem: ubuntu-22.04, phpVersion: '8.4', dependencies: highest }
          - { operatingSystem: windows-latest, phpVersion: '8.4', dependencies: highest }
          # The oldest versions composer.json allows: catches a dependency floor that is too low.
          - { operatingSystem: ubuntu-22.04, phpVersion: '8.4', dependencies: lowest }
          # Next PHP: reports new deprecations early, but does not fail the run yet.
          - { operatingSystem: ubuntu-22.04, phpVersion: '8.5', dependencies: highest, experimental: true }
    runs-on: ${{ matrix.operatingSystem }}
    continue-on-error: ${{ matrix.experimental == true }}
    timeout-minutes: 15
    name: ${{ matrix.operatingSystem }} / PHP ${{ matrix.phpVersion }} / ${{ matrix.dependencies }} deps
    steps:
      - name: Checkout changes
        uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.phpVersion }}
          tools: composer:v2
          # What the library, PHPUnit, Composer and the Symfony components actually use.
          extensions: ctype, curl, dom, iconv, json, libxml, mbstring, openssl, simplexml, tokenizer, xml, xmlwriter
          coverage: none

      - name: Setup dependency cache
        id: composercache
        shell: bash
        run: |
          dir=$(composer config cache-files-dir | sed 's|\\|/|g')
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.dependencies }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.dependencies }}-

      - name: Install Composer dependencies
        shell: bash
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress --no-scripts
          else
            composer install --no-interaction --no-progress --no-scripts
          fi

      - name: Fetch recorded fixtures from source
        # Tests are hermetic against recorded responses. link-fixtures clones the
        # jikan-me/jikan-fixtures repo and re-points the package at it, so CI never
        # depends on the packagist dev-master snapshot being fresh (a new fixtures PR
        # used to break CI until the lock pin was bumped).
        run: composer run-script link-fixtures

      - name: Run tests
        env:
          CI_ENV: true
        shell: bash
        # paratest is only a speed-up. At the lowest versions Composer pairs it with a PHPUnit it does not
        # fully support, so that job runs plain PHPUnit: what it checks is the library at its floor.
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            ./vendor/bin/phpunit
          else
            ./vendor/bin/paratest
          fi

  # Report-only: line coverage, recorded fixtures no test loads, and model fields no recorded page fills.
  # It never fails the run; the numbers guide which page variants to record next.
  coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    continue-on-error: true
    name: coverage and fixture reports
    steps:
      - name: Checkout changes
        uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: ctype, curl, dom, iconv, json, libxml, mbstring, openssl, simplexml, tokenizer, xml, xmlwriter
          coverage: pcov

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --no-scripts

      - name: Fetch recorded fixtures from source
        run: composer run-script link-fixtures

      - name: Run tests with coverage
        env:
          JIKAN_FIXTURE_LOG: ${{ runner.temp }}/fixture-log.txt
        run: ./vendor/bin/phpunit --coverage-text --only-summary-for-coverage-text --coverage-clover coverage.xml

      - name: Report fixtures no test loads
        run: php scripts/fixtures_unused.php --from-log=${{ runner.temp }}/fixture-log.txt

      - name: Report model fields no recorded page fills
        run: php scripts/field_witness.php

      - name: Keep the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-clover
          path: coverage.xml
